<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Map of the 28 skills across 11 sections">
  <title>Skill map</title>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sec { font-size: 14.5px; font-weight: 700; }
      .cnt { font-size: 11.5px; fill: #57606a; }
      .item { font-size: 11.5px; fill: #1f2328; }
      .blurb { font-size: 12px; fill: #6e7781; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text class="t" x="40" y="52" font-size="20" font-weight="700">Skill map: 28 skills across 11 sections</text>
  <text class="t" x="40" y="76" font-size="13" fill="#57606a">Each skill is a folder with a SKILL.md. Copy the folders you want into your agent's skills directory, or install the whole set as a plugin.</text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#d8dee4"/>

  <!-- row 1 -->
  <g>
    <rect x="40" y="118" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="60" y="146">Preconstruction</text>
    <text class="t cnt" x="370" y="146" text-anchor="end">3 skills</text>
    <text class="t m item" x="60" y="172">bid-go-no-go</text>
    <text class="t m item" x="60" y="192">constructability-risk-review</text>
    <text class="t m item" x="60" y="212">programme-and-sequencing-options</text>
    <text class="t blurb" x="60" y="238">Risk before you price the work</text>
  </g>
  <g>
    <rect x="425" y="118" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="445" y="146">Estimating and takeoff</text>
    <text class="t cnt" x="755" y="146" text-anchor="end">4 skills</text>
    <text class="t m item" x="445" y="172">unit-rate-sanity-check</text>
    <text class="t m item" x="445" y="192">takeoff-review-checklist</text>
    <text class="t m item" x="445" y="212">change-order-pricing-narrative</text>
    <text class="t m item" x="445" y="232">productivity-assumption-stress-test</text>
  </g>
  <g>
    <rect x="810" y="118" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="830" y="146">Architecture and design</text>
    <text class="t cnt" x="1140" y="146" text-anchor="end">4 skills</text>
    <text class="t m item" x="830" y="172">design-brief-from-conversation</text>
    <text class="t m item" x="830" y="192">specification-section-draft</text>
    <text class="t m item" x="830" y="212">code-and-accessibility-checklist</text>
    <text class="t m item" x="830" y="232">design-review-agenda</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="40" y="270" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="60" y="298">Visualisation and rendering</text>
    <text class="t cnt" x="370" y="298" text-anchor="end">3 skills</text>
    <text class="t m item" x="60" y="324">photorealistic-exterior-render</text>
    <text class="t m item" x="60" y="344">interior-render-iteration</text>
    <text class="t m item" x="60" y="364">render-critique-before-client</text>
