  </g>
  <g>
    <rect x="425" y="270" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="445" y="298">Engineering</text>
    <text class="t cnt" x="755" y="298" text-anchor="end">2 skills</text>
    <text class="t m item" x="445" y="324">load-path-sanity-check</text>
    <text class="t m item" x="445" y="344">mep-coordination-clash-triage</text>
    <text class="t blurb" x="445" y="376">Sense checks, never calculations</text>
  </g>
  <g>
    <rect x="810" y="270" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="830" y="298">Scheduling and planning</text>
    <text class="t cnt" x="1140" y="298" text-anchor="end">2 skills</text>
    <text class="t m item" x="830" y="324">schedule-narrative-for-owner</text>
    <text class="t m item" x="830" y="344">lookahead-constraint-sweep</text>
    <text class="t blurb" x="830" y="376">Records a delay claim is built from</text>
  </g>

  <!-- row 3 -->
  <g>
    <rect x="40" y="422" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="60" y="450">Site and field operations</text>
    <text class="t cnt" x="370" y="450" text-anchor="end">2 skills</text>
    <text class="t m item" x="60" y="476">daily-report-from-notes</text>
    <text class="t m item" x="60" y="496">rfi-drafting</text>
    <text class="t blurb" x="60" y="528">Messy notes into real records</text>
  </g>
  <g>
    <rect x="425" y="422" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="445" y="450">Safety and compliance</text>
    <text class="t cnt" x="755" y="450" text-anchor="end">2 skills</text>
    <text class="t m item" x="445" y="476">jsha-from-task-description</text>
    <text class="t m item" x="445" y="496">toolbox-talk-from-near-miss</text>
    <text class="t blurb" x="445" y="528">Written with a competent person</text>
  </g>
  <g>
    <rect x="810" y="422" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="830" y="450">Contracts and commercial</text>
    <text class="t cnt" x="1140" y="450" text-anchor="end">2 skills</text>
    <text class="t m item" x="830" y="476">contract-risk-review</text>
    <text class="t m item" x="830" y="496">notice-letter-draft</text>
    <text class="t blurb" x="830" y="528">Drafted here, decided with your lawyer</text>
  </g>

  <!-- row 4 -->
  <g>
    <rect x="40" y="574" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="60" y="602">Business development</text>
    <text class="t cnt" x="370" y="602" text-anchor="end">2 skills</text>
    <text class="t m item" x="60" y="628">case-study-from-facts</text>
    <text class="t m item" x="60" y="648">proposal-tailoring</text>
    <text class="t blurb" x="60" y="680">The writing that wins the next job</text>
  </g>
  <g>
    <rect x="425" y="574" width="350" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t sec" x="445" y="602">Automation and analysis</text>
    <text class="t cnt" x="755" y="602" text-anchor="end">2 skills</text>
    <text class="t m item" x="445" y="628">ifc-data-extraction-script</text>
    <text class="t m item" x="445" y="648">job-cost-analysis-in-python</text>
    <text class="t blurb" x="445" y="680">For people who would rather script it</text>
  </g>
  <g>
