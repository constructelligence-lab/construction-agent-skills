    <text class="t sec" x="830" y="602" fill="#57606a">Everything is CC BY 4.0</text>
    <text class="t blurb" x="830" y="628">Adapt the skills to your own trades, regions and</text>
    <text class="t blurb" x="830" y="646">contract forms. Credit Constructelligence and link</text>
    <text class="t blurb" x="830" y="664">to the licence. Every skill produces a draft that a</text>
    <text class="t blurb" x="830" y="682">named person reviews before it leaves your company.</text>
  </g>

  <text class="t" x="40" y="760" font-size="12" fill="#6e7781">constructelligence-lab / construction-agent-skills</text>
  <text class="t" x="40" y="780" font-size="12" fill="#6e7781">constructelligence.co</text>
</svg>
